<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulsating Dripping Heart</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #050505;
            /* Very dark background */
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Heart Construction using CSS */
        .heart {
            position: relative;
            width: 100px;
            height: 100px;
            background-color: #7a001e;
            /* Darker maroon for normal state */
            transform: rotate(-45deg);
            box-shadow: -5px 5px 45px #7a001e;
            animation: pulse 1.5s ease-in-out infinite;
            z-index: 10;
        }

        .heart::before {
            content: '';
            position: absolute;
            top: -50%;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: inherit;
            /* Inherit color to animate together */
            border-radius: 50%;
            box-shadow: -5px -5px 45px inherit;
        }

        .heart::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 100%;
            height: 100%;
            background-color: inherit;
            /* Inherit color to animate together */
            border-radius: 50%;
            box-shadow: 5px 5px 45px inherit;
        }

        /* Pulsating and Glowing Animation */
        @keyframes pulse {
            0% {
                transform: rotate(-45deg) scale(1.0);
                background-color: #7a001e;
                /* Darker maroon */
                box-shadow: -5px 5px 30px #7a001e;
                filter: drop-shadow(0 0 5px rgba(122, 0, 30, 0.5));
            }

            50% {
                transform: rotate(-45deg) scale(1.3);
                background-color: #ff0033;
                /* Bright neon red */
                box-shadow: -10px 10px 100px #ff0033;
                /* Strong glow */
                filter: drop-shadow(0 0 50px rgba(255, 0, 51, 1));
                /* Dazzle effect */
            }

            100% {
                transform: rotate(-45deg) scale(1.0);
                background-color: #7a001e;
                box-shadow: -5px 5px 30px #7a001e;
                filter: drop-shadow(0 0 5px rgba(122, 0, 30, 0.5));
            }
        }

        /* Dripping Hearts Styles */
        .drop {
            position: absolute;
            background-color: #ff0033;
            width: 10px;
            height: 10px;
            transform: rotate(-45deg);
            pointer-events: none;
            animation: fall 2s linear forwards;
            opacity: 0;
            box-shadow: 0 0 10px #ff0033;
            /* Add glow to drops */
        }

        .drop::before,
        .drop::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #ff0033;
            border-radius: 50%;
        }

        /* Cupid Styles */
        .cupid {
            position: absolute;
            top: 60%;
            /* Lower position */
            left: -100px;
            /* Start off-screen left */
            width: 150px;
            height: 150px;
            background-image: url('https://static.vecteezy.com/system/resources/thumbnails/057/554/981/small/wonderful-contemporary-cupid-with-bow-and-arrow-transparent-background-professional-png.png');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 20;
            /* transform: scaleX(-1); Removed flip, face right */
        }

        .cupid.fly {
            animation: flyBy 4s linear forwards;
        }

        @keyframes flyBy {
            0% {
                left: -100px;
                top: 60%;
            }

            50% {
                left: 20%;
                top: 70%;
            }

            /* Fly to shooting position (bottom-left) */
            100% {
                left: 120%;
                top: 60%;
            }
        }

        /* Arrow Styles */
        .arrow {
            position: absolute;
            top: 70%;
            left: 20%;
            /* Starts near Cupid's path */
            width: 220px;
            /* Longer to look like it pierces through */
            height: 12px;
            background: linear-gradient(to right, #e6b800, #ffcc00);
            /* Golden gradient */
            z-index: 20;
            /* On top of heart */
            opacity: 0;
            transform: translate(-50%, -50%) rotate(-45deg);
            /* Pointing Up-Right, centered on its position */
            border-radius: 2px;
            filter: drop-shadow(0 0 2px rgba(255, 204, 0, 0.5));
            /* Use filter for shadow to respect transparency */
        }

        /* Arrow Head */
        .arrow::before {
            content: '';
            position: absolute;
            right: -20px;
            /* Head at the right end (front) */
            top: -14px;
            width: 0;
            height: 0;
            border-left: 25px solid #ffcc00;
            /* Pointing right */
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
        }

        /* Arrow Fletching (Tail) */
        .arrow::after {
            content: '';
            position: absolute;
            left: -10px;
            /* Tail at the left end (back) */
            top: -10px;
            width: 20px;
            height: 30px;
            background: linear-gradient(to left, #e6b800, #ffcc00);
            clip-path: polygon(100% 10%, 0 0, 0 100%, 100% 90%, 80% 50%);
        }

        .arrow.shoot {
            opacity: 1;
            animation: shootArrow 0.5s linear forwards;
            /* Faster shot */
        }

        @keyframes shootArrow {
            0% {
                left: 20%;
                top: 80%;
                opacity: 1;
                transform: translate(-50%, -50%) rotate(-45deg);
            }

            100% {
                left: 50%;
                top: 50%;
                opacity: 1;
                transform: translate(-50%, -50%) rotate(-45deg);
            }

            /* Moves to center, piercing through */
        }

        .arrow.embedded {
            left: 50%;
            top: 50%;
            opacity: 1;
            transform: translate(-50%, -50%);
            /* No rotation needed, inherits -45deg from parent */
            /* No animation needed, inherits pulse from parent */
            background: linear-gradient(to right, #e6b800 0%, #ffcc00 27%, transparent 27%, transparent 75%, #e6b800 75%, #ffcc00 100%);
            /* Transparent middle only when embedded */
        }

        /* Message Styles */
        .message {
            position: absolute;
            top: 30%;
            left: 70%;
            transform: translate(-50%, -50%) rotate(45deg);
            /* Counteract heart rotation */
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            opacity: 0;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            z-index: 30;
        }

        .message.show {
            animation: fadeIn 2s ease-in forwards;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(45deg) scale(0.5);
            }

            100% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(45deg) scale(1);
            }
        }

        .drop::before {
            top: -50%;
            left: 0;
        }

        .drop::after {
            top: 0;
            left: 50%;
        }

        @keyframes fall {
            0% {
                opacity: 1;
                transform: translate(0, 0) rotate(-45deg) scale(0.5);
            }

            100% {
                opacity: 0;
                transform: translate(0, 200px) rotate(-45deg) scale(0.2);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="cupid"></div>
        <div class="arrow"></div>
        <div class="heart">
            <div class="message">Te amo Wendel</div>
        </div>
    </div>
    
    <script>
        function createHeartDrop() {
            const container = document.querySelector('.container');
            const heart = document.querySelector('.heart');

            // Create the drop element
            const drop = document.createElement('div');
            drop.classList.add('drop');

            // Get heart position
            const rect = heart.getBoundingClientRect();
            // Center X of the heart
            const centerX = rect.left + rect.width / 2;
            // Bottom tip Y of the heart (approximate)
            // The bounding box includes the lobes, so the tip is at the very bottom.
            const bottomTipY = rect.bottom - 15; // Subtract a bit to overlap slightly

            // Spawn drops along the bottom "V" shape of the heart
            // The heart's bottom is roughly triangular.
            // We pick a random X offset from the center.
            // The straight edges are roughly 70-80px long horizontally from the center.
            const spread = 80; // Maximum spread to cover the full V-shape
            const randomX = (Math.random() - 0.5) * (spread * 2);

            // Calculate Y based on X to follow the V shape (slope is 1 for 45deg)
            // As we move away from center, Y goes up.
            const yOffset = Math.abs(randomX); // Slope 1 matches the 45deg rotation
            const startY = bottomTipY - yOffset;

            drop.style.left = (centerX + randomX) + 'px';
            drop.style.top = startY + 'px';

            // Randomize size slightly
            const scale = 0.5 + Math.random() * 0.5;
            drop.style.transform = `rotate(-45deg) scale(${scale})`;

            container.appendChild(drop);

            // Remove the drop after animation ends
            setTimeout(() => {
                drop.remove();
            }, 3000);
        }

        // Create drops continuously
        setInterval(createHeartDrop, 50); // Increased frequency slightly

        // Animation Sequence
        window.addEventListener('load', () => {
            const cupid = document.querySelector('.cupid');
            const arrow = document.querySelector('.arrow');
            const message = document.querySelector('.message');

            // Start Cupid flying after a short delay
            setTimeout(() => {
                cupid.classList.add('fly');

                // Shoot arrow when Cupid is in position (approx 1.5s into flight)
                setTimeout(() => {
                    arrow.classList.add('shoot');

                    // Show message when arrow hits (approx 0.5s after shot start)
                    // Also switch arrow to embedded pulsing state
                    setTimeout(() => {
                        message.classList.add('show');

                        // Switch to embedded state to pulse with heart
                        arrow.classList.remove('shoot'); // Remove shoot animation
                        arrow.classList.add('embedded'); // Add pulse animation

                        // Move arrow inside heart to sync pulse animation
                        document.querySelector('.heart').appendChild(arrow);

                    }, 500); // Match shootArrow duration (0.5s)

                }, 1500);

            }, 1000);
        });
    </script>
</body>

</html>
